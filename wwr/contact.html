<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Dry Oar White Water Rafting</title>
  <meta name="author" content="Frank Boscan">
  <meta name="description" content="The dedicated page for contact information for Dry Oar. Send us a message and find us on Google Maps.">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/dry-oar-logo.png" alt="Dry Oar White Water Rafting logo">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="company-info">
      <h1>Dry Oar White Water Rafting</h1>
      <p>Mather Family Camp, Office 103</p>
      <p>35250 Mather Rd, Groveland, CA 95321, USA</p>
      <p>+1 203 456 7890</p>
      <p>contact@dry-oar.com</p>
    </div>
    <div class="map-form">
      <iframe src="https://www.google.com/maps/embed?pb=!1m28!1m12!1m3!1d7730.61687829305!2d-119.86163197556105!3d37.87954492341575!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m13!3e0!4m5!1s0x8096df119fefa075%3A0xdc9a62c705a9a7a0!2sMather%20Family%20Camp%2C%2035250%20Mather%20Rd%2C%20Groveland%2C%20CA%2095321%2C%20%C3%89tats-Unis!3m2!1d37.883144099999996!2d-119.85383789999999!4m5!1s0x8096df119fefa075%3A0xdc9a62c705a9a7a0!2sMather%20Family%20Camp%2C%2035250%20Mather%20Rd%2C%20Groveland%2C%20CA%2095321%2C%20%C3%89tats-Unis!3m2!1d37.883144099999996!2d-119.85383789999999!5e0!3m2!1sfr!2sfr!4v1786095251389!5m2!1sfr!2sfr"
              loading="lazy"
              allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="George Washington" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="contact@example.com" required>

        <label>Message Purpose</label>
        <div class="radio-group">
          <label><input type="radio" id="general" name="purpose" value="general" checked> General Inquiry</label>
          <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
          <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
        </div>

        <label for="message">Message</label>
        <textarea name="message" id="message" placeholder="Type here"></textarea>

        <div class="form-full">
          <input type="checkbox" id="subscribe" name="subscribe" checked>
          <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
        </div>

        <button type="submit">Get in Touch!</button>
      </form>
    </div>
    <div class="serve">
      <h2>Here to Help</h2>
      <figure>
        <img src="images/beardicus.jpeg" alt="Kevin &quot;Beardicus&quot; Wilkes - &quot;Moderate&quot; Guide">
        <figcaption>Kevin &quot;Beardicus&quot; Wilkes<br>&quot;Moderate&quot; Guide</figcaption>
      </figure>
      <figure>
        <img src="images/guillermo.webp" alt="Guillermo Lugo - &quot;Easy&quot; Guide">
        <figcaption>Guillermo Lugo<br>&quot;Easy&quot; Guide</figcaption>
      </figure>
      <figure>
        <img src="images/ernest.webp" alt="Ernest Renan - &quot;Hard&quot; Guide">
        <figcaption>Ernest Renan<br>&quot;Hard&quot; Guide</figcaption>
      </figure>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 - Dry Oar - Frank Boscan</p>
    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook.svg" alt="Facebook logo">
      </a>
      <a href="https://youtube.com">
        <img src="images/youtube.svg" alt="YouTube logo">
      </a>
      <a href="https://x.com">
        <img src="images/x-logo.svg" alt="X logo">
      </a>
    </nav>
  </footer>
</body>
</html>
