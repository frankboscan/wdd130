    <div class="or-else">
      <p>Sign up for the newsletter. Or else.</p>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">

    <div class="see">
      <a href="trips.html">&#8592; See where they are!</a>
    </div>
    <div class="facts">
      <figure>
        <img src="images/rafting1.png" alt="A team burning calories on the river">
        <figcaption>Did you know that, depending on your body type, whitewater rafting will burn you 350-500 calories per hour? Johny swears we've got routes that can beat 500, and Robert prefers those that'll do around 200. In any case: if you're behind on your weight loss goals, come book a trip! Or, if you're like Ernest, take a couple hours of intense rafting as license to eat a huge, juicy burger with fries. It's a win-win for you and your goals. That's why we're here: we help you reach your goals (kind of).</figcaption>
      </figure>
      <figure>
        <img src="images/rafting2.gif" alt="A trip for the whole family to enjoy">
        <figcaption>Is it hard getting your whole family to agree on what to do over the weekend? Are you looking for bonding activities? Well look no further! We've got rafts to accommodate whatever size family you have. Did you know that 94% of children say that attending events creates positive family memories? And 75% say they feel a stronger family connection afterward? Just bring them all on the whitewater raft of love. They'll never forget. That's also why we're here (kind of).</figcaption>
      </figure>
