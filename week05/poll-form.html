<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Form</title>
  <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
  <header>
    <h1>WDD 130 | HTML Form - User Poll</h1>
  </header>
  <main>
    <form>
      <fieldset>
        <legend>Contact information</legend>
        <div class="form-item column2">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" required>
        </div>
        <br>
        <div class="form-item column2">
          <label for="useremail">Email Address</label>
          <input type="email" id="useremail" name="useremail" required>
        </div>
      </fieldset>
      <fieldset>
        <legend>Questions</legend>
        <div class="form-item column1">
          <label for="browser">What is your favorite browser?</label>
          <select id="browser" name="browser">
            <option value="Chrome">Chrome</option>
            <option value="Edge">Edge</option>
            <option value="Internet Explorer">Internet Explorer</option>
            <option value="Safari">Safari</option>
          </select>
        </div>
        <br>
        <div class="form-item column1">
          <label for="pet">Do you have a pet?</label>
          <input type="checkbox" id="pet" name="pet" checked>
        </div>
        <br>
        <div class="form-item">
          <label for="feedback">List the places you have lived</label>
          <textarea name="feedback" id="feedback" placeholder="Barrow, AK&#10Rose Atoll, AS&#10etc..." rows="5"></textarea>
        </div>
      </fieldset>
      <button type="submit">Submit Poll</button>
    </form>
  </main>
  <footer>
    &copy; 2026 | HTML Form - User Poll Activity | Frank Boscan
  </footer>
</body>
</html>
